name: gemworkers_core
description: "GemWorkers Core Business Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.9.1

  # Navigation
  go_router: ^16.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Future Inventory Features
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/